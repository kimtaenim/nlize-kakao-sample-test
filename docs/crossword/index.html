<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>무한 크로스워드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<meta name="description" content="아래로 끝없이 이어지고, 다 푼 윗부분은 걷어내며 올라붙는 한글 낱말 퍼즐">
<style>
  :root {
    --c: 44px;
    --bg: #0e1218; --panel: #161c26; --line: #263041; --ink: #e8edf5; --dim: #8994a6;
    --accent: #ffd166; --ok: #58d68d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: -.3px; white-space: nowrap; }
  h1 span { color: var(--accent); }
  .stats { display: flex; gap: 12px; margin-left: auto; font-size: 12px; color: var(--dim); }
  .stats b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 6px; }
  .tools button, .cluebar button {
    background: #202836; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .tools button:hover, .cluebar button:hover { background: #2a3446; }
  .tools button:active { transform: translateY(1px); }

  main { flex: 1; display: flex; min-height: 0; }
  #scroller { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; position: relative; }
  #board { padding: 10px 0 45vh; transition: filter .3s; }
  #board.lift { filter: brightness(1.12); }
  #layer { position: relative; margin: 0 auto; width: calc(var(--c) * 8); }

  .cell {
    position: absolute; top: 0; left: 0;
    width: calc(var(--c) - 3px); height: calc(var(--c) - 3px);
    background: #1a212c; border: 1px solid var(--line); border-radius: 7px;
    display: grid; place-items: center; cursor: pointer; opacity: 1;
    transition: transform .38s cubic-bezier(.2,.85,.25,1), opacity .35s,
                background .15s, border-color .15s, box-shadow .15s;
  }
  .cell b { font-size: calc(var(--c) * .5); font-weight: 600; line-height: 1; }
  .cell i {
    position: absolute; top: 2px; left: 4px; font-style: normal;
    font-size: calc(var(--c) * .24); color: #5c6779; line-height: 1;
  }
  .cell.inword { background: #202c3e; }
  .cell.cur { background: #2c3d59; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,209,102,.3); }
  .cell.solved { background: #16301f; border-color: #2f6b42; color: #7fe0a3; }
  .cell.solved i { color: #4a7a5c; }
  .cell.born { opacity: 0; }
  .cell.gone { opacity: 0; }

  aside {
    width: 290px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 4px 0 24px; font-size: 12.5px;
  }
  aside h3 { margin: 12px 14px 6px; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { display: flex; gap: 8px; padding: 6px 14px; cursor: pointer; line-height: 1.4; color: #c3cbd8; }
  aside li:hover { background: #1d2532; }
  aside li b { color: var(--dim); min-width: 20px; text-align: right; font-weight: 600; }
  aside li.ok { color: #4e7a60; text-decoration: line-through; }
  aside li.on { background: #26344a; color: #fff; }
  aside li.on b { color: var(--accent); }
  @media (max-width: 860px) { aside { display: none; } }

  footer { flex: none; background: var(--panel); border-top: 1px solid var(--line); }
  .cluebar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 46px; }
  .cluebar .ph { color: var(--dim); font-size: 13px; }
  .tag {
    font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; flex: none;
    background: #33405a; color: #b9cbe8;
  }
  .tag.d { background: #4a3a20; color: var(--accent); }
  .txt { flex: 1; font-size: 13.5px; line-height: 1.35; min-width: 0;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .len { font-size: 11px; color: var(--dim); flex: none; }

  #kb { padding: 4px 3px 8px; }
  body.nokb #kb { display: none; }
  .krow { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
  .key {
    flex: 1; max-width: 42px; height: 42px; border-radius: 7px; border: 1px solid var(--line);
    background: #232c3a; color: var(--ink); font-size: 16px; font-family: inherit; cursor: pointer;
  }
  .key:active { background: #33415a; }
  .key.fn { background: #1b222d; color: var(--dim); font-size: 14px; max-width: 52px; }
  .key.fn.on { background: var(--accent); color: #1a1a1a; }

  #flash {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, 10px);
    font-size: 30px; font-weight: 800; color: var(--ok); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  #flash.on { opacity: 1; transform: translate(-50%, -14px); }
  #flash { white-space: nowrap; }

  dialog {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 14px; padding: 20px 22px; max-width: 420px; font-size: 13.5px; line-height: 1.65;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 10px; font-size: 16px; }
  dialog ul { padding-left: 18px; margin: 8px 0; }
  dialog b { color: var(--accent); }
  dialog button { margin-top: 14px; width: 100%; padding: 9px; border-radius: 8px; border: 0;
    background: var(--accent); color: #1a1a1a; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<header>
  <h1>무한 <span>크로스워드</span></h1>
  <div class="stats">
    <span>걷어낸 줄 <b id="depth">0</b></span>
    <span>단어 <b id="solved">0</b></span>
    <span>점수 <b id="score">0</b></span>
  </div>
  <div class="tools">
    <button id="kbtoggle" title="자판 켜기/끄기">⌨</button>
    <button id="help" title="도움말">?</button>
    <button id="new">새로</button>
  </div>
</header>

<main>
  <div id="scroller"><div id="board"><div id="layer"></div></div></div>
  <aside id="list"></aside>
</main>

<footer>
  <div class="cluebar">
    <button id="prev" title="이전 단어">‹</button>
    <div id="clue" style="flex:1;display:flex;align-items:center;gap:8px;min-width:0"></div>
    <button id="hint" title="한 칸 열기">💡</button>
    <button id="next" title="다음 단어">›</button>
  </div>
  <div id="kb"></div>
</footer>

<div id="flash"></div>

<dialog id="howto">
  <h2>어떻게 노나요</h2>
  <ul>
    <li>퍼즐은 <b>아래로 끝없이</b> 이어집니다. 스크롤해서 내려가며 푸세요.</li>
    <li>화면 안의 어떤 칸이든 <b>순서 없이</b> 아무 때나 풀 수 있습니다.</li>
    <li>맨 윗부분이 <b>빈틈없이 다 풀리면</b> 그 줄들이 걷히고, 남은 판이 위로 올라붙습니다.</li>
    <li>칸을 누르면 선택, 같은 칸을 다시 누르면 <b>가로↔세로</b> 전환.</li>
    <li>PC는 한/영을 <b>영문</b>에 두고 두벌식 그대로 타이핑 — 스페이스로 방향 전환, Tab으로 다음 단어.</li>
    <li>💡는 한 칸을 열어 주지만 점수가 깎입니다.</li>
  </ul>
  <button onclick="this.closest('dialog').close()">시작하기</button>
</dialog>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
